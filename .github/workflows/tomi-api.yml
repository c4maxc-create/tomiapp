name: TOMI API and PostgreSQL restore checks

"on":
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'tool/prepare_pg_drill.py'
      - '.github/workflows/tomi-api.yml'
      - '.github/workflows/tomi-security.yml'
      - '.github/workflows/tomi-client-integration.yml'
      - '.github/workflows/tomi-client-integration.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'tool/prepare_pg_drill.py'
      - '.github/workflows/tomi-api.yml'
      - '.github/workflows/tomi-security.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tomi-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: SQLite, PostgreSQL and restore drill
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tomi_test
          POSTGRES_USER: tomi_ci
          POSTGRES_PASSWORD: ephemeral_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Check tracked source for common credential patterns
        run: python3 tool/check_source_secrets.py
      - name: Install FFmpeg for media worker tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install locked API dependencies
        working-directory: server
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run complete API suite with SQLite
        timeout-minutes: 15
        working-directory: server
        run: npm test
      - name: Run complete API suite with PostgreSQL 17
        timeout-minutes: 15
        working-directory: server
        env:
          TEST_DATABASE_URL: postgresql://tomi_ci:ephemeral_ci_password@localhost:5432/tomi_test
        run: npm test
      - name: Prepare isolated PostgreSQL restore drill
        env:
          TOMI_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 tool/prepare_pg_drill.py
      - name: Verify encrypted backup and restore
        timeout-minutes: 5
        env:
          TEST_DATABASE_URL: postgresql://tomi_ci:ephemeral_ci_password@localhost:5432/tomi_test
        run: node server/test/pg-restore-drill.mjs
