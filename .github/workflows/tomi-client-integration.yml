name: TOMI non-games client HTTP integration

"on":
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'server/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/tomi-client-integration.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'server/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/tomi-client-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tomi-client-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-http:
    name: Flutter clients against isolated real Node API fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TOMI_CHAT_INTEGRATION: '1'
      TOMI_MESSAGING_INTEGRATION: '1'
      TOMI_CALL_INTEGRATION: '1'
      TOMI_HOME_INTEGRATION: '1'
      TOMI_PRIVACY_INTEGRATION: '1'
      TOMI_CONTENT_INTEGRATION: '1'
      TOMI_MODERATION_INTEGRATION: '1'
      TOMI_IDENTITY_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install FFmpeg for backend media worker tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install locked isolated API test runtime
        working-directory: server
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run full backend typecheck and isolated SQLite API suite
        working-directory: server
        timeout-minutes: 15
        run: npm test
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Resolve locked Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Run non-games HTTP integration contracts
        timeout-minutes: 25
        run: |
          flutter test --reporter expanded \
            test/chat12_api_integration_test.dart \
            test/messaging_api_integration_test.dart \
            test/call_api_integration_test.dart \
            test/room_api_integration_test.dart \
            test/home_api_integration_test.dart \
            test/privacy_api_integration_test.dart \
            test/content30_api_integration_test.dart \
            test/moderation_api_integration_test.dart \
            test/identity_api_integration_test.dart
