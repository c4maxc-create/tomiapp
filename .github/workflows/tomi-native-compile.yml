name: TOMI Android native compile verification
"on":
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tomi-native-compile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6.1.0
        with: {persist-credentials: false}
      - name: Reserve space on the disposable hosted runner
        env:
          TOMI_CI_RUNNER_ENV: ${{ runner.environment }}
        run: python3 tool/prepare_android_ci.py early
      - uses: actions/setup-node@v6
        with: {node-version: '24'}
      - uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-dotnet@v5
        with: {dotnet-version: '8.0.x'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: '3.47.7', cache: true}
      - name: Generate client and public provider configuration
        env:
          TOMI_FACEBOOK_APP_ID: ${{ vars.TOMI_FACEBOOK_APP_ID }}
          TOMI_FACEBOOK_CLIENT_TOKEN: ${{ secrets.TOMI_FACEBOOK_CLIENT_TOKEN }}
          TOMI_GOOGLE_SERVICES_JSON: ${{ secrets.TOMI_GOOGLE_SERVICES_JSON }}
          TOMI_REQUIRE_PUSH: 'true'
          TOMI_REQUIRE_GOOGLE_LOGIN: 'true'
        run: |
          bash tool/bootstrap_android.sh
          python3 tool/configure_firebase.py
          python3 tool/check_identity_native.py
      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-tomi-gradle-downloads-v1-${{ hashFiles('pubspec.lock', 'tool/configure_android.py', '.github/workflows/tomi-android.yml') }}
          restore-keys: |
            ${{ runner.os }}-tomi-gradle-downloads-v1-
      - name: Keep the Flutter NDK and configure bounded Gradle workers
        env:
          TOMI_CI_RUNNER_ENV: ${{ runner.environment }}
        run: python3 tool/prepare_android_ci.py android --minimum-gib 20
      - name: Compile and test native encryption
        timeout-minutes: 10
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 test --locked --manifest-path packages/tomi_secure/native/Cargo.toml
          python3 tool/build_secure_native.py --platform android
      - name: Package actual CSharp game UI
        run: python3 tool/build_csharp_games.py
      - name: Resolve and analyze the client
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
      - name: Compile Android client and native plugins
        run: |
          mkdir -p build
          set -o pipefail
          python3 tool/prepare_android_ci.py check --minimum-gib 20
          python3 tool/retry_android_build.py -- flutter build apk --debug --no-pub --dart-define=TOMI_API_URL=https://tomiapp.onrender.com --dart-define=TOMI_PREVIEW_MODE=false --dart-define="TOMI_PUSH_CONFIGURED=$TOMI_PUSH_CONFIGURED" 2>&1 | tee build/tomi-android-native.log
      - name: Report public signing fingerprints for Firebase
        run: python3 tool/report_apk_certificate.py build/app/outputs/flutter-apk/app-debug.apk
      - name: Verify the APK contains the updated Google web client
        env:
          TOMI_GOOGLE_SERVICES_JSON: ${{ secrets.TOMI_GOOGLE_SERVICES_JSON }}
        run: python3 tool/report_google_apk_config.py build/app/outputs/flutter-apk/app-debug.apk --require-google
      - name: Report bounded Android compiler diagnostics
        if: failure()
        run: python3 tool/report_android_native.py
      - name: Save privately testable APK
        uses: actions/upload-artifact@v4
        with:
          name: TOMI-build43-native-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
