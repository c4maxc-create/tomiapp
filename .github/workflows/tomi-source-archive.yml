name: TOMI source archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Export exact main source
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Create source archive from tracked files
        run: git archive --format=zip --output=tomi-main-source.zip HEAD
      - name: Verify archive and create SHA-256 checksum
        run: sha256sum tomi-main-source.zip > tomi-main-source.zip.sha256
      - name: Upload source archive and checksum
        uses: actions/upload-artifact@v4
        with:
          name: tomi-main-source-${{ github.sha }}
          path: |
            tomi-main-source.zip
            tomi-main-source.zip.sha256
          if-no-files-found: error
          retention-days: 7
