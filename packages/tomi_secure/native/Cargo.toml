[package]
name = "tomi_secure"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
[dependencies]
vodozemac = { version = "=0.11.2", default-features = false }
serde_json = "=1.0.154"
base64 = "=0.22.1"
aes-gcm = "=0.10.3"
argon2 = "=0.5.3"
getrandom = "=0.4.3"
zeroize = "=1.9.1"
[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
