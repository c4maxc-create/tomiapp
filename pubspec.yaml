name: tomi_app
description: TOMI Arabic native app with private chats, voice and video calls, avatars and optional push.
publish_to: none
version: 1.7.0-beta.1+26

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  file_selector: 1.1.0
  url_launcher: 6.3.3
  video_player: 2.14.1
  livekit_client: 2.13.1
  flutter_webrtc: ^1.6.2+hotfix.4
  record: ^7.1.2
  just_audio: ^0.10.6
  path_provider: ^2.1.5
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  web_socket_channel: ^3.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  crypto: ^3.0.7
  image_picker: ^1.2.3
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  video_player_platform_interface: 6.9.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
