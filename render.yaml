services:
  - type: web
    name: tomi-accounts
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --ignore-scripts --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: TRUST_PROXY
        value: '1'
      - key: DATABASE_URL
        sync: false
