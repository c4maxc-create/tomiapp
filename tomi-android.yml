name: TOMI Android Preview

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tomi-android-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build preview APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Download project source
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android scaffold
        run: bash tool/bootstrap_android.sh

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze

      - name: Test demo interactions and compact screens
        run: flutter test --reporter expanded

      - name: Build preview APK
        run: |
          flutter build apk --debug --no-pub
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-debug.apk output/TOMI-preview-0.1.apk

      - name: Upload preview APK
        uses: actions/upload-artifact@v7
        with:
          path: output/TOMI-preview-0.1.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
